services:
  postgres:
    image: postgres:16-alpine
    container_name: nasaweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agriculture
      POSTGRES_USER: agriculture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_agriculture_password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agriculture_postgres_data:/var/lib/postgresql/data
      - ./generated:/imports:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriculture -d agriculture"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agriculture_postgres_data:
    name: nasaweb_agriculture_postgres_data
